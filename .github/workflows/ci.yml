name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ORT_VERSION: 1.22.0
  ORT_SHA256: 8344d55f93d5bc5021ce342db50f62079daf39aaafb5d311a451846228be49b3

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.x", "stable"] # declared minimum and latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Install ONNX Runtime
        run: |
          curl -fsSL -o ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          echo "${ORT_SHA256}  ort.tgz" | sha256sum -c -
          tar -xzf ort.tgz -C "$RUNNER_TEMP"
          echo "TALKIE_TEST_ORT=$RUNNER_TEMP/onnxruntime-linux-x64-${ORT_VERSION}/lib/libonnxruntime.so.${ORT_VERSION}" >> "$GITHUB_ENV"
      - run: go vet ./...
      # The engine's simulated rooms take too long under the race detector;
      # they run without it, the concurrent code with it.
      - run: go test -race $(go list ./... | grep -v /internal/engine)
      - run: go test ./internal/engine
